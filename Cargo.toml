[package]
name = "kefir"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
license = "Apache-2.0"

[profile.release]
overflow-checks = true
codegen-units = 1

# Attribution only: release code plus line tables. Build with
# RUSTFLAGS="-C force-frame-pointers=yes" for perf call graphs. Instruction
# counts from this profile are not measurements of the release build.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

[features]
default = []
introspection = []

[dependencies]
num-bigint = { version = "=0.4.6", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
